##############################################
# 全局配置文件
# 路径: common/config/config.yaml
##############################################

#==============================================公共层配置======================================================#

common:
  # ---------- 日志配置 ----------
  logger:
    ros2_level: "INFO"      # DEBUG, INFO, WARN, ERROR, FATAL
    level: 1                # DEBUG=0, INFO=1, WARN=2, ERROR=3, FATAL=4, NONE=5
    console: true           # 输出到终端
    file: ""                # 输出到文件


#============================================系统服务层配置=====================================================#

services:


#========================================驱动层+驱动接口层配置===================================================#

drivers:
  # ---------- 控制板配置 ----------
  controller_board:
    serial:
      port: "/dev/ttyACM0"   # 端口
      baudrate: 1000000      # 波特率
      timeout_ms: 100        # 超时时间 ms

  # ---------- 传感器超时配置 ----------
  sensors:
    timeout_ms: 5000         # 更新超时时间 ms（驱动层使用，BMS/IMU 的 valid 字段）

  # ---------- BMS配置 ----------
  bms:
    publish_rate: 10         # Hz，发布频率

    # 电池电压阈值（用于 SOC 计算和健康监控）
    voltage:
      max: 12.6              # 满电 (100%)
      warn: 10.8             # 警告 (约15%-25%)
      critical: 9.8         # 停止 (约5%-10%)

    # 话题配置
    topics:
      voltage: "/bms/voltage"   # 电压发布话题 (V)
      soc: "/bms/soc"           # 电量发布话题 (0-100%)

  # ---------- IMU配置 ----------
  imu:
    publish_rate: 100        # Hz，发布频率
    frame_id: "imu_link"     # 坐标系
    gyro_unit: 0             # 0: deg/s, 1: rad/s,
    #src/drivers/include/port/driver_port.h->IMU_DATA_GET()->需要与移植接口的陀螺仪数据单位相匹配,以决定上层算法要不要做转换

    # ----- 坐标系校准 -----
    # ROS2 标准: +x向前, +y向左, +z向上
    # 根据 IMU 实际安装方向配置映射
    # 可选值: x, y, z, -x, -y, -z

    # 运行 ros2 launch bringup dri_bringup.launch.py
    # 运行 ros2 topic echo /imu/data_raw
    # 倾斜测试linear_acceleration
    # 动作            哪个轴变化  
    # 前倾（车头向下）  正/负     -> y: 0.9 -> front: "y"
    # 前倾（左侧向下）  正/负     -> x: -0.9 -> left: "-x"
    # 水平放置         正/负     -> z: 0.9 -> up: "z"
    # 校准后重新运行,读取配置,再次进行倾斜测试,结果应该是ROS2标准方向
    axis_mapping:
      front: "y"             # 前方向对应的轴
      left: "-x"              # 左方向对应的轴
      up: "z"                # 上方向对应的轴

    # 话题配置
    topics:
      data_raw: "/imu/data_raw"   # IMU 原始数据发布话题

  # ---------- 底盘配置 ----------
  motors:
    count: 4
    max_speed: 1.33          # r/s 最大正转速度，0是停止
    min_speed: -1.33         # r/s 最大反转速度，0是停止
    watchdog_timeout: 1.0    # 超过1秒没接收到指令自动停止，0:无看门狗
    publish_rate: 50         # Hz，发布 /chassis/motor_states 的频率

    # 底盘电机ID映射
    mapping:
      left_front: 0          # 左前轮电机ID
      right_front: 2         # 右前轮电机ID
      left_rear: 1           # 左后轮电机ID
      right_rear: 3          # 右后轮电机ID

    # 方向系数（左轮正转向前，右轮正转向后）
    direction:
      left_front: 1
      right_front: -1
      left_rear: 1
      right_rear: -1

    # 话题配置
    topics:
      motor_cmd: "/chassis/motor_cmd"       # 底盘控制指令，订阅的话题名
      motor_states: "/chassis/motor_states" # 底盘状态反馈，发布的话题名


#================================================算法层配置====================================================#

algorithms:
  # ---------- IMU 工具配置 ----------
  imu_tools:
    # 互补滤波系数 (0~1, 越大越信任陀螺仪)
    # 0.98: 98% 陀螺仪 + 2% 加速度计
    alpha: 0.98

    # ----- 零漂校准配置 -----
    bias_calibration:
      enabled: true              # 是否启用零漂校准
      auto_calibrate: false      # 启动时是否自动校准（需要小车静止）
      samples: 200               # 校准采样次数（100-500）
      stability_threshold: 0.05  # 稳定性阈值 (rad/s),超过此值认为数据不稳定,校准允许的抖动范围
      # 预置零偏值（从之前校准结果获取，如果 auto_calibrate=false 则使用此值）
      preset_bias:
        x: 0.0757
        y: 0.2716
        z: -0.0067

    # 话题配置
    topics:
      input: "/imu/data_raw"     # 订阅的原始 IMU 数据
      output: "/imu/data"        # 发布的处理后 IMU 数据（含四元数）

    # 坐标系
    frame_id: "imu_link"
    publish_rate: 100            # Hz（可选）

  
#================================================应用层配置====================================================#

applications:


#====================================================END=======================================================#
