##############################################
# 全局配置文件
# 路径: common/config/config.yaml
##############################################

#==============================================公共层配置======================================================#

common:
  # ---------- 日志配置 ----------
  logger:
    ros2_level: "INFO"      # DEBUG, INFO, WARN, ERROR, FATAL
    level: 1                # DEBUG=0, INFO=1, WARN=2, ERROR=3, FATAL=4, NONE=5
    console: true           # 输出到终端
    file: ""                # 输出到文件


#============================================系统服务层配置=====================================================#

services:


#========================================驱动层+驱动接口层配置===================================================#

drivers:
  # ---------- 控制板配置 ----------
  controller_board:
    serial:
      port: "/dev/ttyACM0"   # 端口
      baudrate: 1000000      # 波特率
      timeout_ms: 100        # 超时时间 ms

  # ---------- 传感器超时配置 ----------
  sensors:
    timeout_ms: 5000         # 更新超时时间 ms(驱动层使用，BMS/IMU 的 valid 字段)

  # ---------- BMS配置 ----------
  bms:
    publish_rate: 10         # Hz，发布频率

    # 电池电压阈值(用于 SOC 计算和健康监控)
    voltage:
      max: 12.6              # 满电 (100%)
      warn: 10.8             # 警告 (约15%-25%)
      critical: 9.8          # 停止 (约5%-10%)

    # 话题配置
    topics:
      voltage: "/bms/voltage"   # 电压发布话题 (V)
      soc: "/bms/soc"           # 电量发布话题 (0-100%)

  # ---------- IMU配置 ----------
  imu:
    publish_rate: 100        # Hz，发布频率
    frame_id: "imu_link"     # 坐标系
    gyro_unit: 0             # 0: deg/s, 1: rad/s
    # src/drivers/include/port/driver_port.h->IMU_DATA_GET()->需要与移植接口的陀螺仪数据单位相匹配

    # ----- 坐标系校准 -----
    # ROS2 标准: +x向前, +y向左, +z向上
    # 根据 IMU 实际安装方向配置映射
    # 可选值: x, y, z, -x, -y, -z,变化最大轴*期望g输出
    axis_mapping:
      front: "-y"            # 前方向对应的轴
      left: "x"              # 左方向对应的轴
      up: "z"                # 上方向对应的轴

    # 话题配置
    topics:
      data_raw: "/imu/data_raw"   # IMU 原始数据发布话题

  # ---------- 底盘配置 ----------
  motors:
    count: 4
    max_speed: 1.33          # r/s 最大正转速度
    min_speed: -1.33         # r/s 最大反转速度
    watchdog_timeout: 1.0    # 超过1秒没接收到指令自动停止，0:无看门狗
    publish_rate: 50         # Hz，发布 /chassis/motor_states 的频率

    # 底盘电机ID映射
    mapping:
      left_front: 0          # 左前轮电机ID
      right_front: 2         # 右前轮电机ID
      left_rear: 1           # 左后轮电机ID
      right_rear: 3          # 右后轮电机ID

    # 方向系数
    direction:
      left_front: 1
      right_front: -1
      left_rear: 1
      right_rear: -1

    # 话题配置
    topics:
      motor_cmd: "/chassis/motor_cmd"       # 底盘控制指令，订阅的话题名
      motor_states: "/chassis/motor_states" # 底盘状态反馈，发布的话题名


#================================================算法层配置====================================================#

algorithms:
   # ---------- IMU 工具配置 ----------
  imu_tools:
    # 互补滤波系数 (0~1, 越大越信任陀螺仪)
    # 0.98: 平滑，响应慢，适合低速场景
    alpha: 0.98

    # ----- 零点校准配置 -----
    # 作用：消除 IMU 安装倾斜的影响
    # 原理：记录水平静止时的姿态作为参考零点
    #       后续只输出相对于这个零点的变化量
    #       当x,y,z未变换一一对应时相对四元数和绝对四元数是一致的
    # 执行方式：
    #   1. 手动校准: ros2 service call /imu_tools/calibrate_zero_point std_srvs/srv/Trigger "{}"
    #   2. 开机自动: auto_calibration: true（需确保车辆在水平面上）
    zero_point_calibration:
      enabled: true                # 是否启用零点校准功能
      auto_calibration: false      # 开机自动零点校准（默认 false）
      stationary_threshold: 0.02   # 静止检测阈值 (rad/s)
      stationary_samples: 50       # 连续静止采样次数（预留）
      
      # 预置零点四元数（从之前校准结果获取）
      # 校准后复制以下值到配置文件
      preset_zero_point:
        w: 0.0434                     # 四元数实部
        x: 0.6023                     # 四元数虚部 x
        y: -0.7971                    # 四元数虚部 y
        z: -0.0001                    # 四元数虚部 z

    # ----- 零漂校准配置 -----
    # 作用：消除陀螺仪静态偏置
    # 原理：静止时采集 N 个样本，取平均值作为偏置
    #
    # 执行方式：
    #   1. 开机自动: auto_calibration: true（默认）
    #   2. 手动校准: ros2 service call /imu_tools/calibrate_gyro std_srvs/srv/Trigger "{}"
    bias_calibration:
      enabled: true                # 是否启用零漂补偿
      auto_calibration: true       # 开机自动零漂校准（默认 true）
      samples: 200                 # 校准采样次数
      stability_threshold: 0.05    # 稳定性阈值 (rad/s)
      
      # 预置零偏值（从之前校准结果获取）
      preset_bias:
        x: -0.0694                 # X 轴零偏 (rad/s)
        y: 0.2740                  # Y 轴零偏 (rad/s)
        z: -0.0069                 # Z 轴零偏 (rad/s)

    # ----- 输出配置 -----
    publish_relative: true         # true=相对四元数, false=绝对四元数
    publish_rate: 100              # 发布频率 (Hz)

    topics:
      input: "/imu/data_raw"       # 订阅原始 IMU 数据
      output: "/imu/data"          # 发布处理后 IMU 数据

    frame_id: "imu_link"

  # ---------- Twist Handler 配置 ----------
  # 限制平滑滤波：梯形速度规划
  twist_handler:
    # 话题配置
    topics:
      input: "/cmd_vel"           # 订阅大脑的速度指令
      output: "/cmd_vel_limited"  # 发布处理后的速度指令

    # 速度限制
    limits:
      max_linear_x: 0.33      # 最大前向速度 (m/s) = 轮速 × 2π × 半径
      max_linear_y: 0.33      # 最大横向速度 (m/s) = 轮速 × 2π × 半径
      max_angular_z: 7.54     # 最大角速度 (rad/s) =  (max_speed × 2) / (轴距 + 轮距)

    # 加速度限制(梯形速度规划), 每一步最大走多少, 就是每一步限幅
    acceleration:
      max_accel: 1.0         # 最大加速度 (m/s²), 越小越稳，越大响应越快, 起步响应速度适中
      max_decel: 1.5         # 最大减速度 (m/s²), 减速度可以比加速度大一些（急刹更安全） 1.0 ~ 1.5 × max_accel, 刹车比加速快 1.5 倍
      max_angular_accel: 2.0 # 最大角加速度 (rad/s²), 旋转起步平缓

    # 超时保护(秒)
    cmd_timeout: 0.5         # 0.5秒无新指令输出归零

    publish_rate: 50         # 发布频率 (Hz)

  # ---------- Attitude Compensator 配置 ----------
  # 对 pitch/roll 进行姿态补偿，支持低速时崎岖地形补偿
  # - 俯仰补偿(前后方向)：上下坡自动修正速度，防止溜坡
  # - 翻滚补偿(左右方向)：车身倾斜时自动修正横向偏移
  # - 死区处理：消除 IMU 噪声导致的微动
  attitude_compensator:
    # 话题配置
    topics:
      input: "/cmd_vel_limited"        # 订阅 twist_node 的输出
      output: "/cmd_vel_compensated"   # 发布给逆运动学
      imu: "/imu/data"                 # 订阅 IMU 姿态

    # 补偿配置
    enabled: true                      # 是否启用姿态补偿
    gravity_strength: 0.1              # 重力补偿强度 (0.0 ~ 1.0), 0.0:等价于关闭
    max_pitch_angle: 0.523             # 最大俯仰角度 (30°),超过此角度全补偿,暂未使用
    max_roll_angle: 0.523              # 最大翻滚角度 (30°),超过此角度全补偿,暂未使用
    deadband: 0.05                     # 死区阈值 (m/s)，消除 IMU 噪声导致的微动
    
    # ----- 角度死区 -----
    # 小于此角度的倾斜不补偿，避免小障碍物误触发
    # 推荐值: 0.017 (1°), 0.035 (2°), 0.052 (3°)
    angle_deadband: 0.087   # 5° 以下不补偿, 角度越大补偿力度越大，5<x<10*2之间使用平滑过渡，防止跳变

    # ----- 速度相关补偿 -----
    # 速度低于此值时，不进行补偿 (避免静止抖动)
    # 速度越高，补偿强度越大 (线性增加)
    # 取值范围: < 轮速 × 2π × 半径 
    speed_threshold: 0.20   # 0~0.2速度时,速度因子补偿为0~100%, 大于0.2时100%

    # 补偿公式
    # 车头抬起，加速，以抵抗向后的拉力
    # 车尾抬起，减速，以抵抗向前的推力
    # 左侧抬起，向左横移，以抵抗向右的拉力
    # 右侧抬起，向右横移，以抵抗向左的拉力
    # 都是为了让车辆能够在各种地形中走直线
    # 第一层:轴方向，加速度方向，角速度方向校准到ros2标准坐标系上
    # 第二层:IMU_tools进行陀螺仪零漂校准，四元数静态零点校准
    # 第三层:Twist消息, 最大速度限幅, 每步加速度与角速度限制(梯形速度规划), 每一步最大走多少, 就是每一步限幅
    # 第四层:姿态补偿, 角度死区(起伏角度<angle_deadband,不补偿,大于角度时使用2倍平滑过渡到当前角度)、速度为0不补偿
    # 俯仰补偿:comp_x = -std::sin(pitch) * gravity_strength * speed_factor; (补偿量随速度和角度线性增加 * 补偿力度)(速度越大补偿量越大)(角度越大补偿量越大)
    # 横滚补偿:comp_y = std::sin(roll) * gravity_strength * speed_factor; (补偿量随速度和角度线性增加 * 补偿力度)(速度越大补偿量越大)(角度越大补偿量越大)
    # 第五层:输出死区,输出速度<deadband时，输出为0，防止IMU静态扰动
    # 第六层:IK解算为四轮速度rs输出

    # Pitch 补偿前后方向：车头抬起向前加速，车头向下向后减速。
    # Roll 补偿左右方向：左侧抬起向左横移，右侧抬起向右横移。
    # 两者独立计算，联合生效。
    # 速度为0时不生效，小于角度死区时不生效，输出过小不生效
    

    # 超时配置
    imu_timeout: 1.0                   # IMU 数据超时时间 (秒)，超时后降级透传

    publish_rate: 50                   # 发布频率 (Hz)

  # ---------- Inverse Kinematics 配置 ----------
  inverse_kinematics:
    # 话题配置
    topics:
      input: "/cmd_vel_compensated"   # 订阅 attitude_compensator 的输出
      output: "/chassis/motor_cmd"    # 发布给底盘驱动

    # 底盘类型: mecanum | differential | 4wd_standard
    # 增加底盘类型步骤：
    # 1. inverse_kinematics.hpp 增加 ChassisType 枚举
    # 2. inverse_kinematics.cpp 增加 chassisTypeToString 字符串
    # 3. 添加 processXXX 求解函数
    # 4. process 函数中调用新增的求解函数
    # 5. ik_node.cpp 中 loadConfig 增加类型赋值
    chassis_type: "mecanum"

    # 底盘参数
    params:
      wheel_base: 0.173    # 轴距 (m)，轮子中心到轮子中心，差速模型忽略该项
      wheel_track: 0.180   # 轮距 (m)，轮子中心到轮子中心
      wheel_radius: 0.04   # 轮子半径 (m)，差速底盘使用
      max_speed: 1.33      # 最大轮速 (r/s)
      min_speed: -1.33     # 最小轮速 (r/s)

    # 超时保护(秒)
    cmd_timeout: 0.5       # 0.5秒无新指令输出归零

    publish_rate: 50       # 发布频率 (Hz)


#================================================应用层配置====================================================#

applications:


#====================================================END=======================================================#