### SLAM Toolbox 配置文件 ###
/**:
  ros__parameters:
    # ============================================================
    # 求解器插件配置
    # ============================================================
    # 使用的求解器插件（Ceres Solver 是 SLAM Toolbox 默认使用的优化库）
    solver_plugin: solver_plugins::CeresSolver

    # Ceres 求解器配置
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY  # 线性求解器类型
    ceres_preconditioner: SCHUR_JACOBI           # 预处理器
    ceres_trust_strategy: LEVENBERG_MARQUARDT    # 信赖域策略
    ceres_dogleg_type: TRADITIONAL_DOGLEG        # Dogleg 类型
    ceres_loss_function: None                    # 损失函数（None = 不使用）

    # ============================================================
    # ROS 坐标系配置
    # ============================================================
    # 里程计坐标系（机器人短期定位基准，会漂移）
    odom_frame: odom
    # 地图坐标系（全局固定，用于建图和长期定位）
    map_frame: map
    # 机器人本体坐标系（必须与 URDF 中的 base_frame 一致）
    base_frame: base_link
    # 备选：如果使用 base_link，取消注释并注释掉上面那行
    # base_frame: base_link

    # ============================================================
    # 话题与模式配置
    # ============================================================
    # 激光雷达扫描数据话题
    scan_topic: /scan
    # 是否启用地图保存功能
    use_map_saver: true
    # 运行模式：mapping（建图）或 localization（定位）
    mode: mapping  # 可选: localization
  
    # ============================================================
    # 地图加载配置（用于继续建图或定位）
    # ============================================================
    # 如果要继续之前的地图，设置地图文件名
    # map_file_name: test_steve
    # 从指定位姿开始（与 map_start_at_dock 互斥）
    # map_start_pose: [0.0, 0.0, 0.0]
    # 从 Dock 位置开始（与 map_start_pose 互斥）
    # map_start_at_dock: true

    # ============================================================
    # 调试与日志
    # ============================================================
    # 是否启用调试日志（大量输出，非必要不开）
    debug_logging: false
    # 扫描数据节流：每 N 帧处理 1 帧（1 = 全部处理）
    throttle_scans: 1

    # ============================================================
    # 变换发布与地图更新
    # ============================================================
    # TF 变换发布周期（秒），0 表示不发布里程计 TF
    transform_publish_period: 0.01
    # 地图更新间隔（秒），越小地图更新越频繁
    map_update_interval: 0.1
    # 地图分辨率（米/像素）
    resolution: 0.05
    # 激光雷达最大有效测距（用于栅格化图像，单位：米）
    max_laser_range: 12.0

    # ============================================================
    # 时间与 TF 配置
    # ============================================================
    # 两次扫描之间的最小时间间隔（秒）
    minimum_time_interval: 0.1
    # TF 变换超时（秒）
    transform_timeout: 0.2
    # TF 缓冲区持续时间（秒），用于缓存历史变换
    tf_buffer_duration: 30.0
    # 程序栈大小（序列化大地图时需要更大的栈）
    stack_size_to_use: 40000000
    # 是否启用交互式模式（允许用户在 Rviz 中操作）
    enable_interactive_mode: true

    # ============================================================
    # 通用扫描匹配参数
    # ============================================================
    # 是否使用扫描匹配
    use_scan_matching: true
    # 是否使用扫描重心（提高匹配精度）
    use_scan_barycenter: true

    # 触发新关键帧的最小移动距离（米）
    minimum_travel_distance: 0.01
    # 触发新关键帧的最小旋转角度（弧度）
    minimum_travel_heading: 0.02

    # 扫描缓冲区大小（保存的历史扫描帧数）
    scan_buffer_size: 100
    # 扫描缓冲区中允许的最大扫描距离（米）
    scan_buffer_maximum_scan_distance: 12.0

    # ============================================================
    # 链接匹配参数（用于扫描与地图的匹配）
    # ============================================================
    # 精细匹配的最小响应阈值
    link_match_minimum_response_fine: 0.1
    # 链接扫描的最大距离（米）
    link_scan_maximum_distance: 1.5

    # ============================================================
    # 回环检测参数
    # ============================================================
    # 是否启用回环检测
    do_loop_closing: true
    # 回环搜索的最大距离（米）
    loop_search_maximum_distance: 3.0
    # 回环匹配的最小链长度
    loop_match_minimum_chain_size: 10
    # 回环匹配的最大粗略方差
    loop_match_maximum_variance_coarse: 3.0
    # 回环匹配的粗略最小响应阈值
    loop_match_minimum_response_coarse: 0.35
    # 回环匹配的精细最小响应阈值
    loop_match_minimum_response_fine: 0.45

    # ============================================================
    # 相关搜索空间参数（扫描匹配用）
    # ============================================================
    # 相关搜索空间的维度（米）
    correlation_search_space_dimension: 0.5
    # 相关搜索空间的分辨率（米）
    correlation_search_space_resolution: 0.01
    # 相关搜索空间的平滑偏差
    correlation_search_space_smear_deviation: 0.1

    # ============================================================
    # 回环搜索空间参数
    # ============================================================
    # 回环搜索空间的维度（米）
    loop_search_space_dimension: 8.0
    # 回环搜索空间的分辨率（米）
    loop_search_space_resolution: 0.05
    # 回环搜索空间的平滑偏差
    loop_search_space_smear_deviation: 0.03

    # ============================================================
    # 扫描匹配惩罚参数
    # ============================================================
    # 距离方差惩罚（越大对距离偏差越敏感）
    distance_variance_penalty: 0.5
    # 角度方差惩罚（越大对角度偏差越敏感）
    angle_variance_penalty: 1.0

    # ============================================================
    # 精细/粗略搜索参数
    # ============================================================
    # 精细搜索角度偏移（弧度）
    fine_search_angle_offset: 0.00349
    # 粗略搜索角度偏移（弧度）
    coarse_search_angle_offset: 0.349
    # 粗略角度搜索分辨率（弧度）
    coarse_angle_resolution: 0.0349

    # 最小角度惩罚阈值
    minimum_angle_penalty: 0.9
    # 最小距离惩罚阈值
    minimum_distance_penalty: 0.5
    # 是否使用响应扩展（提高匹配鲁棒性）
    use_response_expansion: true