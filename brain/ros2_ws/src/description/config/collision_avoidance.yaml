# ================================================================
# Simple Collision Monitor 配置文件
# ================================================================
#
# 功能说明：
#   1. 订阅多个速度指令话题（硬编码：/manual_cmd_vel 和 /cmd_vel）
#   2. 根据优先级仲裁（手动 100 > Nav2 50）
#   3. 对手动指令启用方向感知避障，对 Nav2 指令直接透传
#   4. 发布修正后的速度到 /cmd_vel_safe
#
# 方向感知避障：
#   - 前方有障碍 → 限制前进（linear.x 正方向清零）
#   - 后方有障碍 → 限制后退（linear.x 负方向清零）+ 禁止旋转
#   - 左方有障碍 → 限制左转（angular.z 正方向清零）+ 左移清零
#   - 右方有障碍 → 限制右转（angular.z 负方向清零）+ 右移清零
#   - 多个方向同时触发时，各自限制对应的分量
#
# 配置文件仅包含多边形定义，速度源已在代码中硬编码：
#   - /manual_cmd_vel (priority=100, collision=ON)
#   - /cmd_vel        (priority=50,  collision=OFF)
#
# 尺寸变化：
#   原尺寸 → 缩小 30%（乘以 0.7）
#   Front:  x: 0.05~0.40 → 0.035~0.28,  y: -0.30~0.30 → -0.21~0.21
#   Back:   x: -0.40~-0.05 → -0.28~-0.035,  y: -0.30~0.30 → -0.21~0.21
#   Left:   x: -0.20~0.20 → -0.14~0.14,  y: 0.05~0.40 → 0.035~0.28
#   Right:  x: -0.20~0.20 → -0.14~0.14,  y: -0.40~-0.05 → -0.28~-0.035
# ================================================================

simple_collision_monitor:
  ros__parameters:

    # ============================================================
    # 基础参数
    # ============================================================

    # 机器人本体坐标系（TF 树的根坐标）
    # 所有多边形点都在此坐标系下定义
    # 坐标系：x 正方向为前，y 正方向为左
    base_frame: "base_link"

    # 激光雷达扫描数据话题
    scan_topic: "/scan"

    # 修正后的安全速度输出话题
    # brain_controller 订阅此话题执行运动
    cmd_vel_out_topic: "/cmd_vel_safe"

    # 指令超时时间（秒）
    # 超过此时间未收到新指令，自动发布零速度
    cmd_timeout: 1.0

    # 多边形可视化发布话题
    # 在 Rviz 中添加此话题（PolygonStamped）可查看多边形区域
    polygon_pub_topic: "polygon_visualization"

    # 是否发布多边形可视化
    # true=发布（调试用），false=不发布（生产环境可关闭）
    visualize_polygons: true

    # ============================================================
    # 方向感知多边形
    # ============================================================
    #
    # 工作原理：
    #   1. 将激光雷达点云转换到 base_frame 坐标系
    #   2. 统计落入每个多边形内的点数
    #   3. 若点数 >= min_points，触发该方向限制
    #   4. 同时触发多个方向时，叠加限制（各方向独立）
    #
    # 点顺序（逆时针）：前左 → 前右 → 后右 → 后左
    # 示例：points: [P1.x, P1.y, P2.x, P2.y, P3.x, P3.y, P4.x, P4.y]
    # ============================================================

    # 多边形名称列表（必须与下面的配置一一对应）
    polygon_names:
      - "Front"   # 前方
      - "Back"    # 后方
      - "Left"    # 左方
      - "Right"   # 右方

    # ============================================================
    # 多边形详细配置
    # ============================================================

    polygons:

      # ---------- 前方区域 ----------
      # 检测到障碍物时限制前进（linear.x 正方向清零）
      Front:
        # 多边形顶点（单位：米）
        # 矩形范围：x: 0.035~0.28, y: -0.21~0.21
        points:
          [0.28, 0.21,     # P1: 前左角 (x: 0.28, y: 0.21)
           0.28, -0.21,    # P2: 前右角 (x: 0.28, y: -0.21)
           0.035, -0.21,   # P3: 后右角 (x: 0.035, y: -0.21) 靠近车身
           0.035, 0.21]    # P4: 后左角 (x: 0.035, y: 0.21)
        # 动作类型：direction 表示方向限制
        action: "direction"
        # 触发阈值：至少需要多少个激光点落入多边形
        # 建议 3~5，过滤噪声，真实障碍物通常会有多个点
        min_points: 4
        # 限制的方向：
        #   forward   → 限制前进
        #   backward  → 限制后退
        #   left      → 限制左转和左移
        #   right     → 限制右转和右移
        direction: "forward"

      # ---------- 后方区域 ----------
      # 检测到障碍物时限制后退（linear.x 负方向清零）+ 禁止旋转
      Back:
        # 矩形范围：x: -0.28~-0.035, y: -0.21~0.21
        points:
          [-0.28, 0.21,    # P1: 前左角 (x: -0.28, y: 0.21)
           -0.28, -0.21,   # P2: 前右角 (x: -0.28, y: -0.21)
           -0.035, -0.21,  # P3: 后右角 (x: -0.035, y: -0.21) 靠近车身
           -0.035, 0.21]   # P4: 后左角 (x: -0.035, y: 0.21)
        action: "direction"
        min_points: 4
        direction: "backward"

      # ---------- 左侧区域 ----------
      # 检测到障碍物时限制左转（angular.z 正方向清零）+ 左移（linear.y 正方向清零）
      Left:
        # 矩形范围：x: -0.14~0.14, y: 0.035~0.28
        points:
          [0.14, 0.28,     # P1: 前左角 (x: 0.14, y: 0.28)
           0.14, 0.035,    # P2: 前右角 (x: 0.14, y: 0.035)
           -0.14, 0.035,   # P3: 后右角 (x: -0.14, y: 0.035) 靠近车身
           -0.14, 0.28]    # P4: 后左角 (x: -0.14, y: 0.28)
        action: "direction"
        min_points: 4
        direction: "left"

      # ---------- 右侧区域 ----------
      # 检测到障碍物时限制右转（angular.z 负方向清零）+ 右移（linear.y 负方向清零）
      Right:
        # 矩形范围：x: -0.14~0.14, y: -0.28~-0.035
        points:
          [0.14, -0.035,   # P1: 前左角 (x: 0.14, y: -0.035)
           0.14, -0.28,    # P2: 前右角 (x: 0.14, y: -0.28)
           -0.14, -0.28,   # P3: 后右角 (x: -0.14, y: -0.28) 靠近车身
           -0.14, -0.035]  # P4: 后左角 (x: -0.14, y: -0.035)
        action: "direction"
        min_points: 4
        direction: "right"